name: CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Tests
        run: go test -v ./...

      - name: Build Single Binary
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="v2026.08.08-${{ github.sha }}"
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o bin/c4ignite ./cmd/c4ignite

      - name: Verify Binary CLI
        run: |
          chmod +x bin/c4ignite
          ./bin/c4ignite --help
          ./bin/c4ignite doctor
